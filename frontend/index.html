<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pelagica</title>

        <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
        <link rel="shortcut icon" href="/favicons/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Pelagica" />
        <link rel="manifest" href="/manifest.webmanifest" />
    </head>
    <body style="background-color: #0f0f13; color: white;">
        <div id="root">
            <style>
                .initial-loader {
                    position: fixed;
                    inset: 0;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background-color: #0f0f13;
                    z-index: 99999;
                    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                }
                .initial-loader-content {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    max-width: 24rem;
                    width: 100%;
                    padding-left: 1.5rem;
                    padding-right: 1.5rem;
                    text-align: center;
                }
                .initial-loader-logo-container {
                    position: relative;
                    width: 5rem;
                    height: 5rem;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    user-select: none;
                    animation: initial-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
                }
                .initial-loader-logo {
                    width: 4rem;
                    height: 4rem;
                    object-fit: contain;
                    position: relative;
                    z-index: 10;
                }
                .initial-loader-bar-container {
                    width: 12rem;
                    height: 0.25rem;
                    background-color: rgba(255, 255, 255, 0.1);
                    border-radius: 9999px;
                    overflow: hidden;
                    margin-top: 2rem;
                    position: relative;
                }
                .initial-loader-bar {
                    height: 100%;
                    width: 0%;
                    background-color: #3b82f6;
                    border-radius: 9999px;
                }
                .initial-loader-message {
                    font-size: 0.75rem;
                    color: rgba(255, 255, 255, 0.5);
                    margin-top: 0.75rem;
                    font-weight: 500;
                    letter-spacing: 0.05em;
                    user-select: none;
                }
                .initial-loader-percentage {
                    font-size: 10px;
                    color: rgba(255, 255, 255, 0.3);
                    margin-top: 0.25rem;
                    font-family: monospace;
                    user-select: none;
                }
                @keyframes initial-pulse {
                    0%, 100% { opacity: 1; }
                    50% { opacity: .5; }
                }
            </style>
            <script>
                (function() {
                    try {
                        var theme = localStorage.getItem('vite-ui-theme') || 'system';
                        var isDark = theme === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : theme === 'dark';
                        window.addEventListener('DOMContentLoaded', function() {
                            var logoEl = document.getElementById('initial-logo');
                            var bodyEl = document.body;
                            var loaderEl = document.querySelector('.initial-loader');
                            var messageEl = document.querySelector('.initial-loader-message');
                            var pctEl = document.querySelector('.initial-loader-percentage');
                            var barContainerEl = document.querySelector('.initial-loader-bar-container');
                            if (isDark) {
                                if (logoEl) logoEl.src = '/logo.svg';
                                if (bodyEl) {
                                    bodyEl.style.backgroundColor = '#0f0f13';
                                    bodyEl.style.color = 'white';
                                }
                                if (loaderEl) loaderEl.style.backgroundColor = '#0f0f13';
                                if (messageEl) messageEl.style.color = 'rgba(255, 255, 255, 0.5)';
                                if (pctEl) pctEl.style.color = 'rgba(255, 255, 255, 0.3)';
                                if (barContainerEl) barContainerEl.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                            } else {
                                if (logoEl) logoEl.src = '/logo-dark.svg';
                                if (bodyEl) {
                                    bodyEl.style.backgroundColor = '#ffffff';
                                    bodyEl.style.color = '#000000';
                                }
                                if (loaderEl) loaderEl.style.backgroundColor = '#ffffff';
                                if (messageEl) messageEl.style.color = 'rgba(0, 0, 0, 0.5)';
                                if (pctEl) pctEl.style.color = 'rgba(0, 0, 0, 0.3)';
                                if (barContainerEl) barContainerEl.style.backgroundColor = 'rgba(0, 0, 0, 0.1)';
                            }
                        });
                    } catch (e) {
                        console.error(e);
                    }
                })();
            </script>
            <div class="initial-loader">
                <div class="initial-loader-content">
                    <div class="initial-loader-logo-container">
                        <img src="/logo.svg" class="initial-loader-logo" alt="Pelagica Logo" id="initial-logo" />
                    </div>
                    <div class="initial-loader-bar-container">
                        <div class="initial-loader-bar"></div>
                    </div>
                    <div class="initial-loader-message">Initializing...</div>
                    <div class="initial-loader-percentage">0%</div>
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
